<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' ipc: http://ipc.localhost; object-src 'none'; base-uri 'none'; form-action 'none'"><title>OneX Desktop</title><link rel="stylesheet" href="./theme.css"><link rel="stylesheet" href="./app.css"><script type="module" src="./app.js"></script></head>
<body>
  <header class="app-header">
    <div class="brand"><img class="brand-mark" src="./logo.png" width="32" height="32" alt=""><div><b>OneX <small>Desktop</small></b><span id="desktop-version" hidden></span></div></div>
    <div class="header-actions">
      <span id="badge" hidden>模拟模式</span><button id="desktop-update" class="primary" type="button" hidden>有更新</button>
      <div id="account-actions" hidden>
        <button id="account-toggle" type="button" aria-expanded="false" aria-controls="account-menu">
          <span id="connection" aria-hidden="true"></span><span id="scope">未登录</span><span class="down-chevron" aria-hidden="true"></span>
        </button>
        <div class="surface account-menu" id="account-menu" aria-label="账号与连接" hidden>
          <p class="account-server"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg><span id="account-server"></span></p>
          <button type="button" id="reconnect"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 4v5h-5M4 20v-5h5M4 10a8 8 0 0 1 13.8-4.8L20 9M4 15l2.2 3.8A8 8 0 0 0 20 14"/></svg>重新连接</button>
          <button type="button" id="hide-on-close" role="switch" aria-checked="false"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 9h16m-11 4 3 3 3-3"/></svg>关闭窗口时隐藏到托盘<span class="account-switch" aria-hidden="true"></span></button>
          <button type="button" id="logout"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 4H5v16h7m-2-8h11m-4-4 4 4-4 4"/></svg>退出登录</button>
        </div>
      </div>
    </div>
    <div class="workspace-tabs" id="workspace-tabs" role="tablist" aria-label="客户端页面" hidden>
      <button type="button" id="workspace-tab" role="tab" aria-selected="true" aria-controls="workspace-panel">启动</button>
      <button type="button" id="tasks-tab" role="tab" aria-selected="false" aria-controls="tasks-panel" tabindex="-1">工作</button>
    </div>
  </header>
  <div class="notice-slot"><p id="notice" role="status" aria-live="polite"></p></div>
  <main id="workbench">
    <section id="workspace-panel" role="tabpanel" aria-labelledby="workspace-tab">
      <div class="page-heading" id="page-heading"><h1 id="title">正在连接本机服务</h1></div>
      <div id="content"></div>
    </section>
    <section id="tasks-panel" role="tabpanel" aria-labelledby="tasks-tab" tabindex="0" hidden></section>
  </main>
  <footer class="diagnostics-footer" id="diagnostics-footer" hidden>
    <section class="diagnostics-body" id="diagnostics" aria-label="诊断信息" hidden>
        <div class="diagnostics-header">
          <div class="feedback-tabs" role="group" aria-label="诊断信息">
            <button type="button" id="logs-tab" aria-controls="logs-panel" aria-pressed="true">运行日志</button>
            <button type="button" id="messages-tab" aria-controls="messages-panel" aria-pressed="false" hidden>消息列表</button>
            <button type="button" id="issue-tab" aria-controls="issue-panel" aria-pressed="false" hidden>反馈信息</button>
          </div>
          <button type="button" id="collapse-diagnostics" aria-label="收起面板"><span class="down-chevron" aria-hidden="true"></span></button>
        </div>
        <section id="logs-panel" aria-labelledby="logs-tab">
        <p id="diagnostics-versions" class="diagnostics-versions"></p>
        <div class="diagnostics-controls">
          <label>来源<select id="diagnostics-source"><option value="">全部来源</option><option value="desktop">Desktop</option><option value="daemon">onexd</option></select></label>
          <label>级别<select id="diagnostics-level"><option value="">全部级别</option><option value="info">信息</option><option value="warn">警告</option><option value="error">错误</option></select></label>
          <label>筛选<input id="diagnostics-query" type="search" placeholder="事件、Agent、版本或错误代码"></label>
        </div>
        <p id="diagnostics-hint" class="diagnostics-hint"></p>
        <ol id="diagnostics-events" class="diagnostics-events" aria-label="最近诊断日志" aria-describedby="diagnostics-scroll-hint" tabindex="0"></ol>
        <p id="diagnostics-scroll-hint" class="diagnostics-scroll-hint" hidden></p>
        </section>
        <section id="messages-panel" aria-labelledby="messages-tab" hidden></section>
        <section id="issue-panel" aria-labelledby="issue-tab" hidden>
          <form id="issue-form"><fieldset id="issue-fields">
            <textarea id="issue-text" required maxlength="20000" rows="3" aria-label="反馈内容" placeholder="描述你遇到的问题…"></textarea>
            <label>添加图片 <input id="issue-images" type="file" multiple accept="image/png,image/jpeg,image/webp"></label>
            <small>最多 3 张，每张不超过 1 MiB</small>
            <label><input id="issue-logs" type="checkbox">附带最近日志（最多 28 条）</label>
            <button class="primary" type="submit">提交</button>
          </fieldset></form>
          <p role="status" id="issue-status"></p>
          <div id="issue-list"><h3>我的反馈</h3><ol id="issue-history"></ol><button type="button" id="issue-more" hidden>加载更多</button></div>
          <section id="issue-detail" aria-label="反馈详情" hidden>
            <button type="button" id="issue-back">返回我的反馈</button>
            <p id="issue-current-status" role="status"></p>
            <p id="issue-original"></p>
            <h3>处理动态</h3>
            <ol id="issue-activities"></ol>
            <button type="button" id="issue-older" hidden>更早的动态</button>
            <form id="issue-comment" hidden>
              <label>补充回复<textarea id="issue-comment-text" required maxlength="1200" rows="3"></textarea></label>
              <button type="submit" class="primary" id="issue-comment-send">发送回复</button>
            </form>
            <p role="status" id="issue-detail-hint"></p>
          </section>
        </section>
    </section>
    <button type="button" id="status-bar" aria-expanded="false" aria-controls="diagnostics">
      <span id="messages-summary" hidden>消息</span><span id="logs-summary">日志</span><span id="issue-summary" hidden>反馈</span>
    </button>
  </footer>
  <dialog id="desktop-update-dialog" class="app-dialog" aria-labelledby="desktop-update-title" aria-describedby="desktop-update-description">
    <h2 id="desktop-update-title">重启更新 OneX Desktop</h2>
    <p id="desktop-update-description">将更新到 <strong id="desktop-update-version"></strong>，然后重新打开 OneX Desktop。已启动的 Agent 会继续运行，重启后仍可在客户端管理。</p>
    <div class="dialog-actions"><button id="cancel-desktop-update" type="button" autofocus>取消</button><button id="confirm-desktop-update" class="primary" type="button">重启更新</button></div>
  </dialog>
  <dialog id="reconnect-dialog" class="app-dialog" aria-labelledby="reconnect-title" aria-describedby="reconnect-description">
    <h2 id="reconnect-title">重启后台服务</h2>
    <p id="reconnect-description">当前还有 Agent 或后台任务。重连可能中断正在处理的请求，部分 Agent 需要重新打开。已保存的对话会保留。</p>
    <div class="dialog-actions"><button id="cancel-reconnect" type="button" autofocus>取消</button><button id="confirm-reconnect" class="primary" type="button">仍然重连</button></div>
  </dialog>
</body></html>
