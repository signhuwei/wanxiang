[package]
name = "onexd"
version.workspace = true
edition.workspace = true

[dependencies]
onex-core.workspace = true
anyhow.workspace = true
bytes.workspace = true
futures-util.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
axum = "0.8"
reqwest = { version = "0.12", features = ["stream", "json"] }
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
subtle = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
tokio-util = "0.7"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
hkdf = "0.12"
sha2 = "0.10"
sha1 = "0.10"
uuid = { version = "1", features = ["serde"] }
chacha20poly1305 = "0.10"
base64 = "0.22"
zeroize = "1"
rand_core = { version = "0.6", features = ["getrandom"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = { version = "0.6", features = ["exception"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSString"] }
security-framework = "3"
security-framework-sys = "2"

[target.'cfg(windows)'.dependencies]
winreg = { version = "0.55", features = ["transactions"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }
